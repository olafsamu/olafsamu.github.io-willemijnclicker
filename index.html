<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Willemijn Clicker</title>


    <style>

        /* =====================================================
           BASIC
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;

            background: linear-gradient(
                135deg,
                #ffe9f2,
                #fff4c7
            );

            color: #333;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

            overflow: hidden;
        }


        /* =====================================================
           MAIN GAME CONTAINER
        ===================================================== */

        .game {
            width: 100%;

            max-width: 700px;

            padding: 30px;
        }


        /* =====================================================
           TITLE
        ===================================================== */

        h1 {
            font-size: 58px;

            color: #ff6f91;

            margin-bottom: 8px;

            text-shadow:
                3px 3px 0 white;
        }


        .subtitle {
            font-size: 18px;

            color: #666;

            margin-bottom: 25px;
        }


        /* =====================================================
           SCORE
        ===================================================== */

        .counter-box {
            background: white;

            padding: 20px;

            border-radius: 20px;

            width: 100%;

            max-width: 400px;

            margin: 0 auto 25px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.08);
        }


        .counter {
            font-size: 60px;

            font-weight: bold;

            color: #ff6f91;
        }


        .counter-text {
            font-size: 18px;

            color: #777;

            margin-top: 3px;
        }


        /* =====================================================
           WILLEMIJN IMAGE
        ===================================================== */

        .willemijn-button {
            border: none;

            background: transparent;

            padding: 0;

            cursor: pointer;

            border-radius: 25px;

            transition: transform 0.15s;
        }


        .willemijn-button:hover {
            transform: scale(1.04);
        }


        .willemijn-button:active {
            transform: scale(0.92);
        }


        .willemijn-image {
            display: block;

            width: 350px;

            max-width: 85vw;

            max-height: 50vh;

            object-fit: contain;

            border-radius: 25px;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.15);
        }


        /* =====================================================
           +1 ANIMATION
        ===================================================== */

        .plus-one {
            position: fixed;

            pointer-events: none;

            font-size: 28px;

            font-weight: bold;

            color: #ff4f81;

            animation:
                floatUp 0.8s ease-out forwards;
        }


        @keyframes floatUp {

            0% {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

            100% {
                opacity: 0;

                transform:
                    translateY(-90px)
                    scale(1.3);
            }

        }


        /* =====================================================
           INSTRUCTION
        ===================================================== */

        .instruction {
            font-size: 17px;

            color: #666;

            margin-top: 20px;
        }


        /* =====================================================
           RESET BUTTON
        ===================================================== */

        .reset-button {
            margin-top: 20px;

            padding: 11px 22px;

            border: none;

            border-radius: 12px;

            background: #ffd166;

            color: #333;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .reset-button:hover {
            background: #ffc44d;

            transform: translateY(-2px);
        }


        /* =====================================================
           SAVE INFORMATION
        ===================================================== */

        .save-info {
            margin-top: 15px;

            font-size: 13px;

            color: #999;
        }


        /* =====================================================
           MOBILE VERSION
        ===================================================== */

        @media (max-width: 600px) {

            h1 {
                font-size: 42px;
            }


            .subtitle {
                font-size: 16px;
            }


            .counter {
                font-size: 45px;
            }


            .willemijn-image {
                width: 290px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         MAIN GAME
    ===================================================== -->

    <main class="game">


        <!-- TITLE -->

        <h1>
            Willemijn Clicker
        </h1>


        <p class="subtitle">
            Click Willemijn and collect as many Willemijnen as possible! 🎉
        </p>


        <!-- =================================================
             SCORE
        ================================================= -->

        <div class="counter-box">

            <div
                id="counter"
                class="counter"
            >
                0
            </div>


            <div class="counter-text">
                Willemijnen
            </div>

        </div>


        <!-- =================================================
             CLICKABLE WILLEMIJN
        ================================================= -->

        <button
            id="willemijnButton"
            class="willemijn-button"
            aria-label="Click Willemijn"
        >

            <img
                src="./images%20%286%29.jpeg"
                alt="Willemijn"
                class="willemijn-image"
            >

        </button>


        <!-- INSTRUCTION -->

        <p class="instruction">
            👆 Click on Willemijn!
        </p>


        <!-- =================================================
             RESET
        ================================================= -->

        <button
            id="resetButton"
            class="reset-button"
        >
            Reset score
        </button>


        <p class="save-info">
            Your score is automatically saved.
        </p>


    </main>



    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>

        /* =====================================================
           LOAD SCORE
        ===================================================== */

        let score =
            Number(
                localStorage.getItem("willemijnScore")
            ) || 0;


        /* =====================================================
           HTML ELEMENTS
        ===================================================== */

        const counter =
            document.getElementById("counter");

        const willemijnButton =
            document.getElementById("willemijnButton");

        const resetButton =
            document.getElementById("resetButton");


        /* =====================================================
           UPDATE SCORE
        ===================================================== */

        function updateCounter() {

            counter.textContent = score;

            localStorage.setItem(
                "willemijnScore",
                score
            );

        }


        /* =====================================================
           SHOW +1 ANIMATION
        ===================================================== */

        function showPlusOne(x, y) {

            const plusOne =
                document.createElement("div");


            plusOne.className =
                "plus-one";


            plusOne.textContent =
                "+1 Willemijn";


            plusOne.style.left =
                x + "px";


            plusOne.style.top =
                y + "px";


            document.body.appendChild(
                plusOne
            );


            setTimeout(
                function() {

                    plusOne.remove();

                },
                800
            );

        }


        /* =====================================================
           CLICK WILLEMIJN
        ===================================================== */

        willemijnButton.addEventListener(
            "click",
            function(event) {

                score += 1;

                updateCounter();


                showPlusOne(
                    event.clientX,
                    event.clientY
                );

            }
        );


        /* =====================================================
           RESET SCORE
        ===================================================== */

        resetButton.addEventListener(
            "click",
            function() {

                score = 0;

                updateCounter();

            }
        );


        /* =====================================================
           START WEBSITE
        ===================================================== */

        updateCounter();

    </script>


</body>
</html>
